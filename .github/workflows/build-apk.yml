name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable (and strip CRLF if any)
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          if ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log; then
            echo "BUILD_OK"
          else
            echo "::error::Gradle assembleDebug failed"
            # Dump the FAILURE block (next ~60 lines) into public annotations.
            awk '/^FAILURE:/{p=1} p{print; if(++n>=60) exit}' gradle-build.log > fail-excerpt.txt || true
            # Also catch Kotlin/Java compiler errors.
            grep -E "^e: |^.*\\.kt:[0-9]+:|^.*Unresolved reference|^.*error:" gradle-build.log \
              | head -40 >> fail-excerpt.txt || true
            while IFS= read -r line; do
              # GitHub annotations choke on some chars; keep it printable.
              safe=$(printf '%s' "$line" | tr -d '\000-\010\013\014\016-\037')
              echo "::error::${safe}"
            done < fail-excerpt.txt
            cat fail-excerpt.txt
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jev-probe-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            gradle-build.log
            fail-excerpt.txt
          if-no-files-found: ignore
