name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable (and strip CRLF if any)
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          if ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log; then
            echo "BUILD_OK"
          else
            echo "::error::Gradle assembleDebug failed"
            awk '/^FAILURE:/{p=1} p{print; if(++n>=60) exit}' gradle-build.log > fail-excerpt.txt || true
            grep -E "^e: |^.*\\.kt:[0-9]+:|^.*Unresolved reference|^.*error:" gradle-build.log \
              | head -40 >> fail-excerpt.txt || true
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -d '\000-\010\013\014\016-\037')
              echo "::error::${safe}"
            done < fail-excerpt.txt
            cat fail-excerpt.txt
            exit 1
          fi

      - name: Rename APK for release
        if: success()
        run: |
          mkdir -p dist
          src=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$src" "dist/jev-probe-v1.3-debug-build${{ github.run_number }}.apk"
          ls -la dist/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jev-probe-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3-build-${{ github.run_number }}
          name: Jev 助手 v1.3 (build ${{ github.run_number }})
          body: |
            自动构建的 debug APK（含微信文字/图片撤回识别）。

            - Commit: `${{ github.sha }}`
            - Workflow: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            安装后需自行开启无障碍与悬浮窗权限。发送永远由人手动点。
          files: dist/*.apk
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            gradle-build.log
            fail-excerpt.txt
          if-no-files-found: ignore
