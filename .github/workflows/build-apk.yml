name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable (and strip CRLF if any)
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          if ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log; then
            echo "BUILD_OK"
          else
            echo "::error::Gradle assembleDebug failed"
            # Surface the real error in public check annotations (no login needed).
            grep -E "^(FAILURE:|\\* What went wrong:|e: |ERROR:|> Task .* FAILED)" gradle-build.log \
              | head -80 \
              | while IFS= read -r line; do echo "::error::$line"; done
            # Also dump a short tail as notices.
            tail -n 40 gradle-build.log | while IFS= read -r line; do echo "::notice::$line"; done
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jev-probe-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
